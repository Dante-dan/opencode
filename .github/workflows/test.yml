# Fork-only adaptation of the repository's test.yml e2e-suite.
# Uses the same app keeper, package install action and artifact upload steps.
name: Btw shortcut validation
on:
  push:
    branches: [btw-ui-qa]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btw-shortcut-validation
  cancel-in-progress: true
jobs:
  keeper:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      PLAYWRIGHT_WORKERS: "1"
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Setup Node for Playwright
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Install Playwright browsers
        working-directory: packages/app
        run: bunx playwright install chromium
      - name: Restore pre-fix production source
        run: git restore --source=8986c892ddbb06a5555800a8044c3672762d0230 -- packages/app/src/composer/model.ts packages/app/src/runtime/extension/commands.tsx
      - name: Run keeper regression before fix
        id: baseline
        continue-on-error: true
        run: bun --cwd packages/app test:e2e:built e2e/regression/btw-sidebar.spec.ts --project chromium --workers 1 --retries 0 --grep 'side-question shortcut'
      - name: Upload before-fix Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btw-shortcut-before
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
      - name: Restore fixed production source
        if: always()
        run: git restore --source=9a967ce3ea214ad565463ae3145c7aa331baa1b8 -- packages/app/src/composer/model.ts packages/app/src/runtime/extension/commands.tsx
      - name: Run existing btw keeper after fix
        if: always()
        run: bun --cwd packages/app test:e2e:built e2e/regression/btw-sidebar.spec.ts --project chromium --workers 1 --retries 0
      - name: Upload after-fix Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btw-shortcut-after
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
      - name: Require the pre-fix regression to fail
        if: always()
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
        run: test "$BASELINE_OUTCOME" = failure
